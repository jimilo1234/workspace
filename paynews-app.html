  <div id="admin-panel-page" class="page">

        <button onclick="exitAdminPanel()" style="width:100%;margin-top:24px;padding:12px;background:var(--bg-input);color:var(--text-primary);border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:14px">退出管理</button>
