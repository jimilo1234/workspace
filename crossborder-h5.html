<script>
const PAGES = [{"intro":true,"title":"关于本知识库","html":"<blockquote>本文件由「华创微课 · 朱哥讲金融」《跨境支付训练营》（讲师：朱学敏，2024 年 01 月）共 9 份 PPT 整理而成，覆盖从认知、业务模式、支付方式、账户体系、核心交易、换汇结汇、清分结算、风控策略到监管合规的完整知识链路。  说明：原 PPT 中的文字均以图片形式存储，本知识库通过 OCR（光学字符识别）提取并人工校对、结构化整理，已剔除水印/品牌噪声并修正明显识别错误。涉及金额、费率、牌照要求等以课程发布时为准，实际业务请以最新监管规定与机构要求为准。 </blockquote><p>共 9 章，覆盖从认知、业务模式、支付方式、账户体系、核心交易、换汇结汇、清分结算、风控策略到监管合规的完整知识链路。</p><p>操作提示：上下滑动屏幕或点底部按钮翻页；左上角「目录」可快速跳转到任意章节；章节导言页会先给出本章概览。</p>"},{"c":1,"ct":"开启跨境支付之门","chapIntro":true,"html":"<blockquote>来源：华创微课《跨境支付训练营》（讲师：朱学敏，\"朱哥讲金融\"）。本章为整个课程的基石，帮助读者建立对跨境支付的整体认知：从\"什么是跨境支付\"出发，延伸到跨境电商的几种形态、交易链路、核心名词、参与主体，以及支撑跨境资金的两条主干支付系统 SWIFT 与 CIPS。</blockquote>"},{"s":"1.1","st":"什么是跨境支付","html":"<ul><li><strong>定义</strong>：在跨境交易中，支付方和收款方位于不同的国家/地区，借助结算工具和支付系统，实现资金跨国、跨地区转移的行为。</li><li><strong>本质</strong>：与境内支付相比，跨境支付增加了\"跨币种、跨时区、跨监管、跨清算网络\"四个维度。</li></ul>"},{"s":"1.2","st":"跨境电商的几种类型（按买卖属地与币种）","html":"<div class=\"tbl-wrap\"><table><thead><tr><th>类型</th><th>买家所属地</th><th>支付币种</th><th>卖家所属地</th><th>结算币种</th><th>举例</th></tr></thead><tbody><tr><td>国内电商</td><td>境内</td><td>人民币</td><td>境内</td><td>人民币</td><td>淘宝、京东</td></tr><tr><td>跨境电商（出口，赚外汇）</td><td>境外</td><td>外币</td><td>境内</td><td>人民币</td><td>Shopee / Lazada</td></tr><tr><td>跨境电商（进口，买买买）</td><td>境内</td><td>人民币</td><td>境外</td><td>外币</td><td>天猫海外、小红书</td></tr><tr><td>海外电商</td><td>境外</td><td>外币</td><td>境外</td><td>外币</td><td>eBay / Amazon</td></tr></tbody></table></div><ul><li>出口电商的核心诉求是<strong>收外汇、结汇回国</strong>；进口电商的核心诉求是<strong>人民币出境购付汇</strong>。</li></ul>"},{"s":"1.3","st":"跨境电商平台（进口）交易链路","html":"<p>简化链路（进口场景）：</p><pre><code>国内企业/消费者 ──订单支付──▶ 跨境支付机构 ──资金结算──▶ 海外电商平台\n                                         │\n                               （通过 CIPS 或 SWIFT 完成跨境资金流转）</code></pre><ul><li>人民币资金出境流程：① 人民币付款 → ② <strong>购汇</strong>（人民币换外币）→ ③ <strong>付汇</strong> → ④ 外币/离岸人民币结算给境外商家。</li><li>具备跨境支付牌照的第三方支付公司，需通过<strong>合作银行</strong>完成购付汇。</li></ul>"},{"s":"1.4","st":"核心名词解释","html":"<ul><li><strong>交易币种</strong>：跨境支付交易时，付款方所看到的商品/服务展示币种。</li><li><strong>收单机构</strong>：从事收单业务的机构，可以是银行或第三方支付等非金机构。</li><li><strong>汇率</strong>：两种货币之间兑换的比率。</li><li><strong>外汇备付金</strong>：支付机构为办理市场交易主体委托的外汇支付业务，而实际收到的暂收待付外汇资金。</li><li><strong>外汇备付金账户</strong>：用于收付市场交易主体暂收待付的外汇资金，按外汇账户管理规定，在每家合作银行开立一个外汇备付金账户。</li><li><strong>卡组织（银行卡转接清算机构）</strong>：授权其银行成员发卡、受理商户的卡交易，在消费者跨境购物时提供转接清算服务（如 VISA、万事达、银联等）。</li><li><strong>SWIFT（环球银行金融电讯协会）</strong>：制定金融机构间通讯标准，主要进行<strong>信息传递</strong>而非资金流动。</li><li><strong>CIPS（人民币跨境支付系统）</strong>：专门用于人民币跨境支付清算业务的支付系统。</li></ul>"},{"s":"1.5","st":"跨境支付交易场景","html":"<p>典型场景包括但不限于：</p><ol><li>货物贸易</li><li>虚拟充值 / 酒店住宿</li><li>DTC（独立站）出海</li><li>平台收款 / 结汇缴费</li><li>航空机票 / 旅游服务</li><li>留学教育</li><li>国际展览 / 国际运输</li><li>B2B 货物贸易（大宗贸易）</li></ol>"},{"s":"1.6","st":"跨境电商交易平台类型","html":"<ul><li><strong>面向跨境电商 B2C 平台</strong>：C 端客户收款、海关支付数据报送、供应商付款。</li><li><strong>面向跨境电商分销 B2C 平台</strong>：分销商收款、供应商付款、分销商融资。</li><li><strong>面向跨境电商供应链 B2B 平台</strong>：下游采购商收款、供应商付款、垫资代采。</li><li><strong>面向跨境电商物流 B2B 平台</strong>：境内物流客户收款、境外物流服务商付款。</li></ul>"},{"s":"1.7","st":"跨境支付参与主体","html":"<ul><li><strong>银行</strong>：提供跨境账户、购付汇、清算等服务。</li><li><strong>国际信用卡组织</strong>：VISA、MasterCard、American Express、Diners Club、JCB、银联等。</li><li><strong>提供跨境聚合支付服务的科技公司</strong>：聚合多家支付通道的科技服务商。</li><li><strong>汇款公司</strong>：Western Union、MoneyGram 等。</li></ul>"},{"s":"1.8","st":"两大跨境支付系统：SWIFT 与 CIPS","html":"<h3>SWIFT</h3><ul><li>以美国为主导建立的<strong>通讯网络</strong>，仅负责传递跨境支付与报告信息，<strong>不参与清算和资金转移</strong>。</li><li>运行时间 24 小时无间断，主要报文标准有 <strong>MT 报文</strong>（Message Type / FIN）和 <strong>MX 报文</strong>（Message XML / ISO 20022）。</li><li><strong>SWIFT 跨境支付链路（信息流 + 资金流）</strong>：</li><li>信息流：付款方 → 境内付款行 → SWIFT 系统 → 境外收款行 → 收款方（订单支付、发送汇款报文、解付入账）。</li><li>资金流：通过 <strong>CHIPS</strong> 等清算系统完成银行间资金结算。</li><li><strong>MT103 报文</strong>（单笔客户汇款）关键字段示例：Sender/Receiver（发报者/接收者）、UETR（唯一端到端交易引用）、20 发报行编号、23B 银行运营代码、32A 起息日/币种/结算金额、50a 汇款人、52a 指示行、53a 发报行代理行、57a 收款人账户行、59a 受益人、71A 费用承担方（如 SHA 双方分担）、72 发报行给收报行信息、77B 监管报告。</li></ul><h3>CIPS（人民币跨境支付系统）</h3><ul><li>处理人民币跨境支付清算业务的<strong>批发类支付系统</strong>，旨在提高跨境清算效率；清算模式包括<strong>清算行模式</strong>和<strong>代理行模式</strong>。</li><li>运行时间 <strong>5×24 小时 + 4 小时</strong>；境内外银行可直接接入 CIPS 实现人民币收付。</li><li>可采用<strong>专线连接，可不依赖 SWIFT 网络</strong>；通过大额支付系统（HVPS）完成注资、调增、调减、清零。</li><li><strong>参与者对比</strong>（截至课程时间，约 89 家直接参与者、1363 家间接参与者）：</li></ul><div class=\"tbl-wrap\"><table><thead><tr><th>维度</th><th>境内直接参与者</th><th>间接参与者</th><th>境外直接参与者</th></tr></thead><tbody><tr><td>CIPS 行号</td><td>有</td><td>有</td><td>有</td></tr><tr><td>CIPS 账户</td><td>有</td><td>没有</td><td>有</td></tr><tr><td>接入方式</td><td>专线接入</td><td>通过直接参与者接入</td><td>通过 SWIFT 或专线接入</td></tr><tr><td>注资及调增</td><td>直接通过大额发起</td><td>不需注资</td><td>通过境内资金托管行发起</td></tr><tr><td>业务发起</td><td>直接发起</td><td>通过直接参与者发起</td><td>直接发起</td></tr></tbody></table></div><ul><li>直接/间接参与者最大区别：<strong>是否在 CIPS 系统内拥有自己的账户</strong>。</li></ul>"},{"s":"1.9","st":"跨境支付业务形态与产业图谱","html":"<ul><li><strong>三流合一</strong>：信息流（订单/平台）、资金流（购付汇、收结汇）、物流（国内/国际物流、海外仓、转运）。</li><li><strong>产业图谱角色</strong>：</li><li>监管机构（国内：人民银行、外汇管理局、海关；国外：FCA、FINMA、ASIC 等）。</li><li>国际卡组织（VISA、MasterCard、银联、American Express）。</li><li>第三方跨境支付公司（支付宝、连连支付、PingPong、Payoneer、汇付天下、拉卡拉、易宝支付、通联支付等）。</li><li>跨境收款公司（万里汇 WorldFirst、PingPong 等）。</li><li>境内外银行与金融机构（中国银行、招商银行、建设银行、花旗、美国银行等）。</li><li>汇款公司（Western Union、MoneyGram、Ria）。</li><li>支撑服务：电商平台、聚合代理商、财务服务、物流服务、广告营销。</li></ul>"},{"s":"1.10","st":"跨境人的职场进阶方向","html":"<p>跨境支付产业链对应四类典型从业机构/方向：</p><ol><li>跨境贸易企业</li><li>跨境电商平台</li><li>跨境第三方支付机构</li><li>跨境商业银行</li></ol>"},{"c":2,"ct":"跨境电商业务模式","chapIntro":true,"html":"<blockquote>本章聚焦\"跨境电商长什么样\"：从定义出发，按交易对象、平台运营方、业务形态、发货模式等多个维度拆解跨境电商的业务模式，并给出 B2B / B2C / C2C 的典型交易流程与对比。</blockquote>"},{"s":"2.1","st":"什么是跨境电商","html":"<ul><li><strong>定义</strong>：在不同国家和地区之间进行的电子商务活动的商业行为。</li><li>涉及角色：商品/生产商、消费者/企业用户、跨境电商平台、跨境支付机构、物流商、海关。</li></ul>"},{"s":"2.2","st":"按交易链路角色的基本模式","html":"<ul><li><strong>平台式跨境电商平台</strong>：平台撮合买卖双方（如 Amazon、eBay、Wish）。</li><li><strong>自营式跨境电商平台</strong>：平台自己备货销售（如部分全球购/海外购自营）。</li><li><strong>第三方综合服务平台</strong>：提供通关、质检、物流、支付等一站式服务。</li><li><strong>出口 vs 进口</strong>：</li><li><strong>出口（赚外汇）模式</strong>：商品以人民币计价、人民币结算，境外消费者支付外币。资金流：境外消费者（外币）→ 订单支付 → 资金结算 → 境内商家（人民币）。</li><li><strong>进口（买买买）模式</strong>：商品以外币计价、外币结算，境内消费者支付人民币。资金流：境内消费者（人民币）→ 订单支付 → 资金结算 → 境外商家（外币）。</li></ul>"},{"s":"2.3","st":"按交易对象区分：B2B / B2C / C2C","html":"<div class=\"tbl-wrap\"><table><thead><tr><th>模式</th><th>交易对象</th><th>说明</th><th>优点</th><th>缺点</th></tr></thead><tbody><tr><td>B2B</td><td>企业 ↔ 企业</td><td>企业间跨境交易</td><td>规模大、成本低</td><td>交易量大，需要更多管理与协调</td></tr><tr><td>B2C</td><td>企业 → 消费者</td><td>企业通过官网/第三方平台向消费者销售</td><td>成本低、交易便捷，消费者直接下单，企业负责发货与售后</td><td>—</td></tr><tr><td>C2C</td><td>消费者 ↔ 消费者</td><td>消费者间跨境交易</td><td>交易便捷</td><td>信任度低，存在一定风险</td></tr></tbody></table></div><ul><li>衍生模式：<strong>O2O</strong>（线上线下结合）、<strong>F2C</strong>（工厂直达消费者）。</li></ul>"},{"s":"2.4","st":"典型交易流程","html":"<h3>跨境 B2B（出口）交易流程</h3><pre><code>境外采购商 ──采购下单/支付申请──▶ B2B出口平台 ──支付申请──▶ 境内收单机构\n   │                                        │                      │\n   │                                    信息流                 国际卡组织\n   │                                        │                      │\n   └──────────── 资金流 ───────────────────┘──付款行──资金划拨──▶ 供货商收款行</code></pre><p>要点：涉及清算机构收款、多段资金划拨（资金划拨1/2/3）、代理行收款。</p><h3>跨境 C2C 交易流程（两条通道）</h3><ul><li><strong>走银联国际</strong>：汇出机构（如 TransferWise、中银香港、银联国际全球速汇 MoneyExpress）→ 银联国际 → 收款机构 → 收款人。含中间机构收款。</li><li><strong>走 SWIFT</strong>：汇出机构与收款机构均对接 SWIFT，使用统一标准的 SWIFT 报文，SWIFT 作为标准化信息传输中枢。</li></ul>"},{"s":"2.5","st":"B2B / B2C / C2C 模式对比总表","html":"<div class=\"tbl-wrap\"><table><thead><tr><th>模式</th><th>交易对象</th><th>基础交易</th><th>典型场景</th><th>代表平台</th></tr></thead><tbody><tr><td>跨境 B2C 进口</td><td>境内 C &amp; 境外 B</td><td>平台上的境外 B 端卖家直接向境内 C 端消费者销售</td><td>跨境电商零售进口</td><td>亚马逊、eBay、Wish、Coupang、Ozon</td></tr><tr><td>跨境 B2C 出口</td><td>境内 B &amp; 境外 C</td><td>境内 B 端通过境外渠道向境外 C 端销售</td><td>跨境电商零售出口、独立站</td><td>京东海外购、天猫国际、Lazada、速卖通、Shopee、唯品会海购</td></tr><tr><td>B2B 跨境贸易</td><td>境内 B &amp; 境外 B</td><td>境内外企业间跨境贸易</td><td>传统大宗进出口、市场采购贸易、海外仓、外贸综合服务</td><td>阿里巴巴、敦煌网、eWorldTrade、ECVV、环球资源、中国制造网</td></tr><tr><td>C2C 跨境直销</td><td>境内 C &amp; 境外 C</td><td>境外 C 端向境内 C 端销售</td><td>海外代购、海外直购、跨境旅行购物</td><td>优盒网、洋立方、c2cmall、兰亭集势、DX、米兰网</td></tr></tbody></table></div>"},{"s":"2.6","st":"按平台运营方区分","html":"<ul><li><strong>进口电商平台</strong>：在中国境内搭建、连接国内消费者与海外商家的交易平台（如天猫国际、京东全球购）。</li><li><strong>出口电商平台</strong>：帮助中国品牌向境外售卖商品的平台（如速卖通、Lazada、亚马逊中国出海）。</li><li><strong>独立站平台</strong>：商家自建或使用第三方建站工具搭建网站，允许境外客户使用国际卡支付（如 Shopify 类独立站、DTC 品牌站）。</li><li><strong>企业自建网站</strong>：企业创建完全属于自己的电商网站，向全球消费者销售产品与服务。</li></ul>"},{"s":"2.7","st":"按业务形态区分（平台类型与特点）","html":"<div class=\"tbl-wrap\"><table><thead><tr><th>业务形态</th><th>交易基础</th><th>优点</th><th>缺点</th><th>代表平台</th></tr></thead><tbody><tr><td>海外代购平台</td><td>小商家/个人按需集中海外采购，转运或直邮到中国</td><td>品类丰富、用户流量大</td><td>商户资质与信用存疑</td><td>淘宝全球购、京东海外购、易趣全球集市、美国购物网</td></tr><tr><td>交易撮合类</td><td>平台接单后转发商家，商家按单发货</td><td>对跨境供应链涉入深、后续潜力大</td><td>前期流量不足、资金体量大</td><td>洋码头、跨境通（上海自贸区）、苏宁全球购</td></tr><tr><td>综合型自营</td><td>平台自己备货销售给境外消费者</td><td>跨境供应链管理能力强</td><td>受行业政策变动影响大</td><td>亚马逊、中粮我买网、1号店海购</td></tr><tr><td>导购/返利平台</td><td>导购资讯、社区论坛、返利吸引消费者，链接海外电商</td><td>模式轻、易开展</td><td>业务不确定性大</td><td>一淘网、什么值得买、极客海淘、美国便宜货</td></tr></tbody></table></div>"},{"s":"2.8","st":"按发货模式区分","html":"<ul><li><strong>直邮模式</strong>：消费者购买境外商品，境外商户通过国际运输直接送达境内消费者。</li><li><strong>保税仓模式</strong>：境外商品入境后暂存保税区内，消费者购买后以个人物品出区，经国内物流送达。</li><li><strong>集货模式</strong>：商户集单后通过国际运输发货。</li></ul><h3>直邮 vs 保税仓（链路对比）</h3><ul><li><strong>直邮模式</strong>：跨境商品/服务交易 → 海外仓储 → 国际物流 → 海关清关 → 国内物流 → 买家收货。</li><li><strong>保税仓模式</strong>：跨境交易 → 中国保税区仓储 → 海关清关 → 国内物流 → 买家收货。</li></ul>"},{"c":3,"ct":"跨境电商支付方式","chapIntro":true,"html":"<blockquote>本章系统梳理\"钱怎么付\"：从传统跨境支付方式（现金/支票、电汇、国际汇款、信用卡）到第三方跨境支付，对比其速度、费率与适用场景；并按业务类型（B2B/B2C/C2C）、收付款平台（各地区本地支付）、付款形式（卡/钱包/转账/BNPL/现金）等多视角展开，最后给出全球支付方式占比。</blockquote>"},{"s":"3.1","st":"什么是跨境支付方式","html":"<ul><li><strong>定义</strong>：不同国家之间进行国际收付款业务或货款结算时所选择的方式。</li></ul>"},{"s":"3.2","st":"主要跨境支付方式（五大类）","html":"<div class=\"tbl-wrap\"><table><thead><tr><th>方式</th><th>形态</th><th>说明</th></tr></thead><tbody><tr><td>外汇现金 / 支票</td><td>传统·线下</td><td>向银行购汇或申请开具支票，指向具体收款人的资金转移</td></tr><tr><td>银行电汇（T/T）</td><td>传统·线上</td><td>汇款人向汇出行申请，以加押电报 / SWIFT 形式指示汇入行解付</td></tr><tr><td>国际汇款（转账）</td><td>传统·线上</td><td>通过银行或汇款公司将款项从付款账户划转到收款账户</td></tr><tr><td>信用卡支付</td><td>传统·线上线下</td><td>基于 VISA / MasterCard / JCB / American Express 等国际卡组织的清算体系</td></tr><tr><td>第三方跨境支付</td><td>线上+线下（扫码）</td><td>由境内外支付机构基于支付系统完成资金清结算</td></tr></tbody></table></div>"},{"s":"3.3","st":"跨境支付方式对比（速度 / 费率 / 场景）","html":"<div class=\"tbl-wrap\"><table><thead><tr><th>支付类型</th><th>速度</th><th>费率</th><th>适用场景</th></tr></thead><tbody><tr><td>外汇现金 / 支票</td><td>线下，到账慢</td><td>手续费高（含手续费 + 汇率费）</td><td>指向具体收款人的资金转移</td></tr><tr><td>银行电汇 T/T</td><td>线上，2–3 天</td><td>高：电报费 + 手续费 + 中转费，分档计费</td><td>金额与收款人均明确的点对点清结算</td></tr><tr><td>国际汇款公司</td><td>线上，10–15 分钟</td><td>欧洲约 1.x%；亚太 1.8%–2.5%；中国 2.8%–3%</td><td>金额与收款人均明确的点对点清结算</td></tr><tr><td>信用卡支付</td><td>线上+线下，T+1 ~ 1–3 工作日</td><td>约 1.5%–2%（一般不另收货币转换费）</td><td>线上海淘交易</td></tr><tr><td>第三方跨境支付</td><td>线上+线下，T+0</td><td>较低，最低约 1%–1.5%</td><td>小额高频交易、跨境电商</td></tr></tbody></table></div>"},{"s":"3.4","st":"传统跨境支付 vs 第三方跨境支付","html":"<ul><li><strong>传统支付模式</strong>：中介层级多且对安全性要求极高；资金到账慢、手续费率较高；支付透明度偏低、用户体验差。</li><li><strong>第三方跨境支付</strong>：满足一对多、多对多的\"信息流 + 资金流\"双流合一；聚合多条收款通道，更便捷；到账时效更高、手续费更低。</li></ul>"},{"s":"3.5","st":"按电商业务类型区分的支付类型","html":"<ul><li><strong>B2B 跨境贸易</strong>：汇付、托收、信用证、保理。</li><li><strong>B2C 跨境电商</strong>：移动支付、二维码、POS 刷卡、网银。</li><li>国内：支付宝、微信支付、银联商务等。</li><li>国外：PayPal、Adyen、Worldpay 等。</li><li><strong>C2C 跨境代购</strong>：汇款（西联汇款、银行转账等）；以及派安盈 WorldFirst、银联国际、PingPong、Airwallex 等。</li></ul><h3>B2B 支付类型案例</h3><ul><li><strong>信用证（L/C）</strong>：大额外贸常用，开证银行为卖方提供付款保证，单据相符即须付款；含即期、延期付款、承兑信用证等。</li><li><strong>托收</strong>：出口方委托银行向进口方收款，能否收款取决于买方信用；风险较低、费用少。</li><li><strong>银行电汇（T/T）</strong>：汇款种类多（票汇、电汇），可分货到付款 / 预付；目前最主要方式，无限额但手续费较高。</li><li><strong>国际保理</strong>：以商业信用出口时，出口商交货后将发票和单据转让给保理商，可先取得部分货款，逾期付款由保理商承担责任。</li></ul>"},{"s":"3.6","st":"按收付款平台（地区/本地支付）区分","html":"<p>全球各区域均有本地化支付方式，除 VISA / MasterCard / American Express 等国际卡外，还包括大量区域钱包与银行转账：</p><ul><li><strong>北美</strong>：PayPal、网上支付、电话/邮件支付等。</li><li><strong>欧洲</strong>：Maestro、Solo（英）、Laser（爱尔兰）、Bizum（西班牙）、CartaSi（意）、Dankort（丹）、SEPA、SOFORT、Klarna、iDEAL、Bancontact、giropay 等。</li><li><strong>东南亚</strong>：GCash、DANA、BPI、PayMaya、OXXO（墨）、Boleto、FPX、Konbini（日）、WebPay 等。</li><li><strong>印度/南亚</strong>：UPI、RuPay、Paytm、BharatPe 等。</li><li><strong>南美/太平洋</strong>：OXXO、Mercado Pago、Multicaja 等。</li><li><strong>韩国</strong>：BCcard、KB、Samsung Pay、Naver Pay 等。</li><li><strong>中国</strong>：Alipay、WeChat Pay、银联等。</li></ul>"},{"s":"3.7","st":"按付款形式区分","html":"<div class=\"tbl-wrap\"><table><thead><tr><th>付款形式</th><th>说明</th></tr></thead><tbody><tr><td>信用卡（Credit Card）</td><td>持卡人可赊账消费，在预设还款日前结清欠款</td></tr><tr><td>借记卡（Debit Card）</td><td>从持卡人账户中直接扣除付款金额</td></tr><tr><td>电子钱包（Digital Wallet）</td><td>关联银行账户、可存储支付信息，支持在线或面对面支付</td></tr><tr><td>先买后付（BNPL）</td><td>允许客户先购买，将账单分若干期后分期还款</td></tr><tr><td>银行转账（Bank Transfer）</td><td>资金从客户账户转入收款人账户，含直接扣款、信用卡转账、重定向账户支付等</td></tr><tr><td>现金付款（Cash）</td><td>凭纸质凭证或付款编号在自助机/银行付款，或货到由送货方代收现金</td></tr></tbody></table></div>"},{"s":"3.8","st":"典型支付界面案例（支付方式 1/5 ~ 5/5）","html":"<ul><li><strong>电子钱包</strong>：如 Cash App Pay，购物车金额 HK$97.42，含税费与净额。</li><li><strong>网银在线支付</strong>：如 Apartments.com 应付 US$344.78，可选择美国银行账户（CHASE / WELLS FARGO / CITI / US BANK）。</li><li><strong>信用卡支付</strong>：VISA 卡号 / 有效期 / CVC / 持卡人 / 国家邮编，可保存卡信息。</li><li><strong>欧洲 SEPA 银行转账</strong>：单笔 €350.00，银行转账方式，付款成功回执。</li><li><strong>先买后付（BNPL）</strong>：如 Afterpay，订单 HK$86.00，可分 4 期无息，每期 HK$21.50。</li></ul>"},{"s":"3.9","st":"全球主流在线支付方式占比","html":"<ul><li>数字钱包（Digital Wallet）：约 <strong>49%</strong></li><li>信用卡（Credit Card）：约 <strong>20%</strong></li><li>借记卡（Debit Card）：约 <strong>12%</strong></li><li>账户转账（Account-to-Account）：约 <strong>6%</strong></li><li>先买后付 / 货到付款 / 现金：各约 <strong>1%–2%</strong></li></ul><blockquote>趋势：数字钱包已成为跨境在线支付第一大方式，BNPL 等新兴方式占比稳步上升。</blockquote>"},{"c":4,"ct":"跨境支付体系账户","chapIntro":true,"html":"<blockquote>本章讲解\"账户\"这一跨境支付的底层载体：什么是跨境收款账户、它与银行账户的区别，以及按开户方式、账户属性、交易属性、交易币种等多维度划分的账户类型；并说明账户申请渠道与商家接入跨境支付的典型流程。</blockquote>"},{"s":"4.1","st":"什么是跨境支付账户","html":"<ul><li><strong>定义</strong>：从事跨境交易的境内个人或企业，在境外银行或支付机构开立的、能够用于<strong>外币收款和付款</strong>的账户。</li><li><strong>关键区别：跨境收款账户 ≠ 银行账户</strong></li><li>跨境收款账户可直接接收外币付款，减少外汇转换风险。</li><li>银行账号通常仅能接收本地货币，企业需通过第三方支付平台或银行外汇业务将外币兑换成本地货币后，再存入银行账户。</li></ul>"},{"s":"4.2","st":"按开户方式区分：电子离岸账户 vs 传统离岸账户","html":"<div class=\"tbl-wrap\"><table><thead><tr><th>维度</th><th>电子离岸账户</th><th>传统离岸账户</th></tr></thead><tbody><tr><td>开户方式</td><td>线上操作，虚拟账户（同支付账户）</td><td>线下柜台/网银，需面签</td></tr><tr><td>开户对象</td><td>大陆/香港公司均可申请；个人仅可用于跨境电商收款</td><td>仅限一定资质或规模的香港公司</td></tr><tr><td>所需材料</td><td>企业证照 + 法人身份信息</td><td>可能需补其他繁琐证明</td></tr><tr><td>开户周期</td><td>1–3 天，最快几分钟</td><td>30–60 天</td></tr><tr><td>开户费用</td><td>0 元</td><td>8000–20000 元</td></tr><tr><td>账户管理费</td><td>0–200 元/年</td><td>0–3000 HKD/年</td></tr><tr><td>收款手续费</td><td>0 元</td><td>约 10 美金/单笔</td></tr><tr><td>提现/转账手续费</td><td>0.2%–0.4%</td><td>约 15 美金/单笔</td></tr><tr><td>结汇手续费</td><td>0 元</td><td>不支持结汇</td></tr><tr><td>其他</td><td>无实体卡，不能收实物款项/支票，主要服务跨境电商客户</td><td>有实体卡，可线下取现，服务线下贸易及中大型客户</td></tr></tbody></table></div>"},{"s":"4.3","st":"按账户属性区分：OSA 离岸账户 vs NRA 境外非居民账户","html":"<div class=\"tbl-wrap\"><table><thead><tr><th>维度</th><th>OSA 离岸账户</th><th>NRA 境外非居民账户</th></tr></thead><tbody><tr><td>开户银行</td><td>浦发、招商、平安、交通、部分外资银行</td><td>境内所有中外资银行</td></tr><tr><td>监管机构</td><td>银保监会</td><td>外汇局</td></tr><tr><td>主要法规</td><td>《离岸银行业务管理办法》及实施细则</td><td>《关于境外机构境内外汇账户管理有关问题的通知》《境外机构人民币结算账户管理办法》</td></tr><tr><td>服务对象</td><td>境外机构和境外个人</td><td>境外机构</td></tr><tr><td>币种</td><td>可自由兑换外币，未开放人民币</td><td>外币 / 人民币</td></tr><tr><td>结售汇</td><td>仅能外汇买卖，不能结售汇</td><td>—</td></tr><tr><td>外汇管制</td><td>没有</td><td>有</td></tr><tr><td>收支要点</td><td>与境外账户资金进出自由；与境内账户划转需审核真实性</td><td>外币 NRA：与境外/境内账户划转不受限制；人民币 NRA：与境外及其他 NRA 自由，与境内人民币账户划转需审核真实性，不能无因划转，且不能从境外同名账户收款</td></tr></tbody></table></div>"},{"s":"4.4","st":"NRA 账户的优势","html":"<ul><li><strong>按需结汇</strong>、自由收贸易货款，可直接收汇结汇（无额度限制）。</li><li>可做<strong>信用证、托收</strong>。</li><li>支持<strong>办理退税</strong>，无需做账报税（仅需年审离岸公司）。</li><li>支持<strong>多币种</strong>（美元/欧元/英镑/港币/日元/韩元/卢布等主流币种）。</li><li>账户管理费低、办理费用低、手续简单，无需买理财/存款，网上操作结汇秒到账。</li></ul>"},{"s":"4.5","st":"按交易属性区分","html":"<ul><li><strong>普通外汇账户</strong>：个人或企业在银行开设的用于收取外汇的账户，不限制资金流动，可随时收付款。</li><li><strong>外汇结算账户</strong>：企业在境外银行开设、用于国际贸易结算的账户，用于支付国际贸易货款。</li><li><strong>外汇结算备付金账户</strong>：企业在境外银行开设、用于存放货币的账户，用于向境外供应商提供定金、采购成本、运费或保证金。</li></ul>"},{"s":"4.6","st":"按交易币种区分","html":"<ul><li><strong>单币种账户</strong>：海外买家可用其所在国家本地银行账户，向商家对应的单币种账户付款。</li><li><strong>多币种账户</strong>：海外买家可通过国际电汇（T/T）等付款至商家的多币种全球收款账户（如支持 USD/EUR/GBP/CNY 等 10+ 主流币种）。</li></ul>"},{"s":"4.7","st":"账户申请渠道","html":"<ul><li>企业需选择合理的费用标准（账户开立费、服务费、汇率兑换费等）。</li><li>常见商业银行：富港银行、花旗、汇丰、星展、中国银行、工商银行、建设银行等。</li></ul>"},{"s":"4.8","st":"商家接入跨境支付的典型链路","html":"<ul><li><strong>境外持牌机构从事跨境收单</strong>：人民币消费者 → 境内支付机构 → 境外持牌支付机构（申请电子离岸账户）→ 资金结算 → 外币计价商品/服务 → 境外商户 1…n。</li><li><strong>境外商户接入</strong>：通过合作银行渠道合作/资金划转，完成人民币付款、外汇结算。</li><li><strong>境内商家接入</strong>：外币消费者 → 境外第三方支付机构 → 境内支付机构（申请电子离岸账户）→ 资金结算 → 人民币计价商品/服务 → 境内商户。</li><li><strong>商家入驻跨境电商平台</strong>（亚马逊、阿里国际站、速卖通、eBay、Shopee、Lazada、Wish 等）：</li><li>流程：申请开店 → 填写信息 → 平台采集入驻信息 → <strong>KYB 审核</strong> → 审批通过/驳回（纠错补充）→ 开立电子离岸账户 → 入驻成功。</li><li>全球收单资质审核是核心环节。</li></ul>"},{"s":"4.9","st":"境内商家申请跨境收款账户（案例流程）","html":"<ol><li><strong>（1/5）选择币种</strong>：美元、港元、欧元、英镑等账户（含 Routing Number / IBAN / Sort Code 等信息）。</li><li><strong>（2/5）选择平台与站点</strong>：Amazon、PayPal、Stripe、Adyen、Shopify、Etsy、Rakuten 等，并选择收款币种（可多选）。</li><li><strong>（3/5）选择账户类型与开户地</strong>：单币种（买家本地付款、到账快、无中间行手续费）或多币种（支持 10 个主流币种，可开中国香港账户）；开户地如美国、新加坡/中国香港。</li><li><strong>（4/5）添加同名银行卡</strong>：验证同名银行账户。</li><li><strong>（5/5）申请成功</strong>：0 费用、秒级到账、全球多币种账户，覆盖美国/印尼/韩国/越南/英国/马来西亚等，20+ 主流货币，无开户费/入账费/维护费。</li></ol>"},{"c":5,"ct":"跨境支付核心交易","chapIntro":true,"html":"<blockquote>本章进入\"交易\"层面：先给出进口（购付汇）与出口（收结汇）两条主链路，再拆解跨境支付的四类核心交易——跨境电商收款、外贸企业收款、全球收单、全球付款；并讲解外卡收单的 EDC 与 DCC 两种模式，以及一笔支付从选择方式到完成的五个关键步骤。</blockquote>"},{"s":"5.1","st":"什么是跨境交易","html":"<ul><li><strong>定义</strong>：在不同国家或地区进行商业、贸易或金融活动，<strong>消费者用外币支付，卖家最终以收到本币完成交易</strong>。</li></ul>"},{"s":"5.2","st":"进口电商平台——购付汇流程","html":"<ul><li>境内消费者在进口电商平台消费，用<strong>人民币</strong>完成支付；第三方支付通过<strong>合作银行</strong>购汇、付汇，将外币结算给境外卖家。</li><li>关键动作：人民币付款 → 渠道合作/资金划转 → 购汇（人民币→外币）→ 付汇 → 跨境收支申报、交易还原、推送支付单。</li><li>信息流：平台订单报关 → 推送物流单 → 海关放行 → 国内物流（保税仓发货 / 海外物流报关）。</li><li>资金流与物流并行：境外卖家通知发货、商品派送，境内消费者收货。</li></ul>"},{"s":"5.3","st":"出口电商平台——收结汇流程","html":"<ul><li>境内企业从事出口，境外消费者用<strong>外币</strong>支付；第三方支付将收取的外币通过合作银行<strong>结汇为人民币</strong>，结算给国内卖家。</li><li>关键动作：外币付款 → 境外第三方支付机构 → 境内第三方支付机构 → 结汇（外币→人民币）→ 资金结算。</li></ul>"},{"s":"5.4","st":"跨境支付核心交易的四大类","html":"<div class=\"tbl-wrap\"><table><thead><tr><th>类别</th><th>说明</th></tr></thead><tbody><tr><td>电商平台收款</td><td>对接 Amazon、AliExpress、Lazada 等主流平台，为跨境卖家提供跨境收款与外汇结算</td></tr><tr><td>外贸企业收款</td><td>覆盖多种贸易场景，支持主流币种与小币种的外贸收款</td></tr><tr><td>全球收单</td><td>为独立站和出海企业提供国际信用卡与海外本地支付方式收单</td></tr><tr><td>全球付款</td><td>面向批量本地/跨境付款需求（平台来账分发、支付机构全球分发、员工工资、多供应商结算）</td></tr></tbody></table></div><h3>（1/4）跨境电商收款</h3><ul><li>对接主流平台，提供多币种收款账户（如美元、欧元、加元、新元账户），支持极速收款（如 WorldFirst）与普通收款。</li></ul><h3>（2/4）外贸企业收款</h3><ul><li>覆盖多种贸易场景，支持主流/小币种；收款方式含 ACH、全球信用卡/借记卡、欧洲本地电子钱包等，以 INVOICE 账单形式发起与对账。</li></ul><h3>（3/4）全球收单</h3><p>按\"商家、消费者、支付机构所在国\"划分三类：</p><ul><li><strong>外卡收单</strong>：商家在境内、消费者在境外（出口业务），帮助国内商家收取国外消费者货款；支付手段为国外信用卡及当地支付工具，通过卡组织或境外支付机构实现外币结算。</li><li><strong>境外收单</strong>：商家在国外、消费者在国内（进口业务），帮助境外商家收取国内消费者货款；支付手段为国内主流支付工具。</li><li><strong>国际收单</strong>：商家、消费者和支付机构分属不同国家进行的货款交易与收单。</li></ul><p><strong>全球收单业务流程</strong>：① 采购下单 → ② 创建 B 外币订单 → ③ A 外币付款 → ④ 展示支付订单 → 申请购汇（外币 B ← 外币 A）/付汇 → 付款结果 → 经境外合作银行、境内支付机构、境外支付机构或银行卡组织完成资金划拨。</p><h3>（4/4）全球付款</h3><ul><li>面向经常性批量付款：电商平台来账分发、支付机构全球分发、员工工资、多供应商结算分发。</li><li>支持多币种（HKD、EUR、SGD 等）、国内/国际付款、全额到账等。</li></ul>"},{"s":"5.5","st":"跨境支付关键流程（五步）","html":"<ol><li><strong>选择支付方式</strong>：根据收付双方需求与情况选择合适方式。</li><li><strong>提交支付指令</strong>：通过银行或第三方支付平台提交指令并填写信息。</li><li><strong>确认汇率和费用</strong>：避免因不同汇率与费用导致金额误差。</li><li><strong>处理支付指令</strong>：银行/支付平台收到后审核、处理。</li><li><strong>支付完成</strong>：资金从付款方账户扣除并转入收款方账户。</li></ol>"},{"s":"5.6","st":"支付案例","html":"<ul><li><strong>Apple Pay 海外购物</strong>：① 购物者选择苹果支付 → ② 核对付款摘要 → ③ 选择关联卡并确认 → ④ 付款确认、Apple Pay 界面关闭、商家显示交易结果。</li><li><strong>银行卡支付</strong>：订单摘要 → 银行卡支付验证 → 发送验证码 → 支付成功（含卡号、有效期、CVC、持卡人等）。</li></ul>"},{"s":"5.7","st":"外卡支付收单模式：EDC vs DCC","html":"<div class=\"tbl-wrap\"><table><thead><tr><th>模式</th><th>全称</th><th>货币处理</th><th>收益/成本</th></tr></thead><tbody><tr><td><strong>EDC 模式</strong></td><td>电子数据采集（Electronic Data Capture）</td><td>由发卡行/卡组织完成货币转换（如外币→本币）</td><td>存在汇率兑换收益/汇损，由收单/发卡侧承担转换</td></tr><tr><td><strong>DCC 模式</strong></td><td>动态货币转换（Dynamic Currency Conversion）</td><td>在商户端向持卡人<strong>报价</strong>本币金额，由持卡人确认是否以本币结算</td><td>商户/收单方给出货币转换报价，持卡人知情选择</td></tr></tbody></table></div><ul><li>参与角色：境外持卡人、特约商户、收单行、银行卡组织（VISA / MasterCard）、持卡人发卡行。</li><li><strong>案例（出口电商外卡收单）</strong>：</li><li>EDC：采购订单 700￥ → 请求支付 700￥ → 实际换汇约 100$（约 107.67$ 参考）。</li><li>DCC：采购订单 100$ → 请求支付 100$ → 货币转换报价 100$（以本币报价）。</li></ul>"},{"c":6,"ct":"跨境支付换汇结汇","chapIntro":true,"html":"<blockquote>本章聚焦\"钱怎么换\"：界定购汇与结汇，列出常见换汇场景与主流币种，拆解购汇、结汇的业务流程与银行实操，并对比实时换汇与预约换汇两种兑换方式，最后提示我国个人换汇政策红线。</blockquote>"},{"s":"6.1","st":"什么是跨境换汇","html":"<ul><li><strong>定义</strong>：把本国货币按照一定的汇率转换成其他国家货币进行的交易活动。</li><li><strong>购汇</strong>：用人民币兑换外币，付款给境外商家。</li><li><strong>结汇</strong>：用外币兑换成人民币，结算给境内商家。</li></ul>"},{"s":"6.2","st":"换汇交易场景","html":"<p>因私旅游、公务及商务出国/探亲、货物贸易、咨询服务、境外留学、境外就医、购买非投资类保险等。</p>"},{"s":"6.3","st":"换汇主流币种（节选）","html":"<div class=\"tbl-wrap\"><table><thead><tr><th>货币</th><th>代码</th><th></th><th>货币</th><th>代码</th></tr></thead><tbody><tr><td>美元</td><td>USD</td><td></td><td>加拿大元</td><td>CAD</td></tr><tr><td>欧元</td><td>EUR</td><td></td><td>澳大利亚元</td><td>AUD</td></tr><tr><td>日元</td><td>JPY</td><td></td><td>新加坡元</td><td>SGD</td></tr><tr><td>英镑</td><td>GBP</td><td></td><td>新西兰元</td><td>NZD</td></tr><tr><td>瑞士法郎</td><td>CHF</td><td></td><td>港币</td><td>HKD</td></tr><tr><td>俄罗斯卢布</td><td>RUB</td><td></td><td>澳门元</td><td>MOP</td></tr><tr><td>人民币</td><td>CNY</td><td></td><td>离岸人民币</td><td>CNH</td></tr><tr><td>韩元</td><td>KRW</td><td></td><td>印度卢比</td><td>INR</td></tr><tr><td>马来西亚林吉特</td><td>MYR</td><td></td><td>泰铢</td><td>THB</td></tr><tr><td>印尼卢比</td><td>IDR</td><td></td><td>越南盾</td><td>VND</td></tr><tr><td>阿联酋迪拉姆</td><td>AED</td><td></td><td>沙特里亚尔</td><td>SAR</td></tr><tr><td>南非兰特</td><td>ZAR</td><td></td><td>巴西雷亚尔</td><td>BRL</td></tr><tr><td>瑞典克朗</td><td>SEK</td><td></td><td>丹麦克朗</td><td>DKK</td></tr><tr><td>波兰兹罗提</td><td>PLN</td><td></td><td>土耳其里拉</td><td>TRY</td></tr><tr><td>菲律宾比索</td><td>PHP</td><td></td><td>墨西哥比索</td><td>MXN</td></tr></tbody></table></div><p>（课程中还列举了挪威克朗 NOK、老挝基普 LAK、斯里兰卡卢比 LKR、缅甸元 MMK、蒙古图格里克 MNT、毛里求斯卢比 MUR、柬埔寨瑞尔 KHR、捷克克朗 CZK、匈牙利福林 HUF、白俄罗斯卢布 BYR、哈萨克斯坦坚戈 KZT、巴基斯坦卢比 PKR、埃及镑 EGP、巴林第纳尔 BHD 等。）</p>"},{"s":"6.4","st":"跨境换汇业务：购汇流程","html":"<ul><li>链路：人民币支付 → 收款 → 资金入账 → <strong>购汇（人民币→外币）</strong> → 资金结算。</li><li>主体：境内消费者 → 持牌支付机构 → 跨境进口平台 → 境内 NRA 人民币账户 → 境外合作银行 → 商户外币账户。</li><li><strong>中国银行购汇实操要点</strong>：购汇委托 → 查询外管系统额度 → 填写资金用途（如\"因私旅游\"）、预计用汇时间、目的地 → 选择现汇/现钞户 → 参考银行现汇卖出价/现钞卖出价 → 购汇委托成功。</li></ul>"},{"s":"6.5","st":"跨境换汇业务：结汇流程","html":"<ul><li>链路：外币支付 → 收款 → 直接入账 → <strong>结汇（外币→人民币）</strong> → 资金结算。</li><li>两种形态：</li><li>跨境独立站/自建站：境外消费者 → 境外合作银行 → 商户海外账户 → 跨境收单机构 → 结汇 → 资金分账 → 商户人民币账户。</li><li>跨境出口平台：境外消费者 → 境外合作银行 → 商户海外账户 → 跨境收单机构 → 结汇 → 商户人民币账户。</li><li><strong>中国银行结汇实操</strong>：自助结汇，外币账户 → 人民币账户，提交结果成功。</li></ul>"},{"s":"6.6","st":"跨境换汇交易平台","html":"<ul><li><strong>银行换汇平台</strong>：服务更全面，整额/小额零钱均可兑换，外汇可存入或提取。</li><li><strong>互联网换汇平台</strong>（如万里汇 WorldFirst）：方便快捷、不受时间空间限制，支持多种支付方式。</li></ul>"},{"s":"6.7","st":"跨境换汇兑换方式","html":"<h3>（一）实时汇率即时换汇</h3><ul><li>按当前市场汇率立即成交，可选 <strong>T+0 实时汇</strong>、<strong>T+1 锁汇</strong>等，系统给出\"优选汇率\"。</li></ul><h3>（二）指定汇率预约换汇</h3><ul><li>设定<strong>目标汇率</strong>，达到心理价位后自动成交（部分平台在监控前不冻结余额，需保证账户有足额资金；也有\"冻结金额、系统划扣\"模式）。</li></ul><h3>万里汇案例</h3><ul><li><strong>即时兑换（1/4–4/4）</strong>：汇率趋势图 → 选择卖出/买入币种（如 美元→离岸人民币 CNH）→ 立即兑换（专享汇率，如 1 USD≈7.24–7.34 CNH）→ 确认兑换信息 → 交易成功。</li><li><strong>指定汇率兑换（1/4–4/4）</strong>：设目标汇率（如 7.30/7.35）→ 允许全部成交 / 截止日期 → 达到汇率自动成交；可设成交方式（全部成交）、自定义区间。</li></ul>"},{"s":"6.8","st":"预约换汇交易状态","html":"<div class=\"tbl-wrap\"><table><thead><tr><th>状态</th><th>含义</th></tr></thead><tbody><tr><td>监测中</td><td>订单未成交，持续监测中</td></tr><tr><td>已成功</td><td>目标汇率达到，成交</td></tr><tr><td>已过期</td><td>达到截止时间，未成交</td></tr><tr><td>已取消</td><td>主动取消预约兑换，冻结金额自动解冻</td></tr><tr><td>已失败</td><td>异常情况，未成交</td></tr></tbody></table></div>"},{"s":"6.9","st":"我国换汇政策（个人购汇\"红线\"）","html":"<ul><li>个人换汇额度：<strong>5 万美元 / 人 / 年</strong>。</li><li>不得虚假申报个人购汇信息。</li><li>不得提供不实的证明材料。</li><li>不得借用他人便利化额度实施分拆购汇。</li><li>不得出借本人便利化额度协助他人购汇。</li><li>不得用于境外买房、证券投资、购买人寿保险和投资性返还分红类保险等尚未开放的资本项目。</li><li>不得参与洗钱、逃税、地下钱庄交易等违法违规活动。</li></ul>"},{"c":7,"ct":"跨境支付清分结算","chapIntro":true,"html":"<blockquote>本章讲解\"账怎么算、钱怎么拨\"：先拆解清算核心（清分/计扣费/计结息/分润），再给出跨境清结算体系与收单分账机制，最后系统对比三种跨境清算模式（代理行 / 清算行 / NRA）和跨境提现结汇流程。</blockquote>"},{"s":"7.1","st":"什么是跨境清结算","html":"<ul><li>跨境清结算指的是跨越不同国家/地区进行跨境贸易和投资时，涉及资金的转移、清算与结算过程。</li></ul>"},{"s":"7.2","st":"跨境清算核心：清分","html":"<p>清分就是把账清楚地算出来，核心环节包括：</p><ul><li><strong>清分</strong>：对各参与方的清算净额、交易明细等进行汇总、整理与分类。</li><li><strong>计扣费</strong>：根据可配置的费率，计算各参与方需扣费金额。</li><li><strong>计结息</strong>：对清算备付金账户进行计息、结息（资金沉淀，双边入账）。</li><li><strong>分润</strong>：根据可配置参数灵活分配收益。</li></ul>"},{"s":"7.3","st":"跨境清结算体系","html":"<ul><li>资金流：买家 →（代理行清算 / 收单行清算 / NRA 结算）→ 卖家。</li><li>三层概念：</li><li><strong>清分</strong>：内部算账、外部算账。</li><li><strong>清算</strong>：资金结转、关联主体分账。</li><li><strong>结算</strong>：建立结算头寸、完成债权交割。</li><li>跨境资金通过 <strong>SWIFT / CIPS / CNAPS</strong> 等支付系统流转，实现外币付款、人民币收款。</li></ul>"},{"s":"7.4","st":"跨境收单分账（以进口电商为例）","html":"<ul><li>收单资金按照<strong>服务费、佣金、补贴、运费、货款</strong>等，支持实时或延时分账到平台各参与方账户。</li><li><strong>境内结算</strong>：</li><li>平台服务费 → 平台对公账户。</li><li>境内物流运费 → 境内物流对公账户。</li><li>推广人佣金 → 推广人银行账户。</li><li><strong>境外结算</strong>：购付汇 → 境外供应商货款 → 境外供应商海外账户（基于人民币备付金）。</li><li><strong>案例（资金分账）</strong>：支付单金额 CNY 2,000.00，拆分为例：电商平台服务费 200、分销佣金 400、出境货款 1,400。</li></ul>"},{"s":"7.5","st":"特约商户收款分账","html":"<ul><li>主体：分账方（服务商 A / B）→ 被分账接收方（特约商户、用户）。</li><li>流程：用户 → 特约商户付款账户 → 资金划出 → 待分账账户 → 订单分账 → 待结算账户 → 资金划入 → 收款账户。</li><li>支持<strong>分账归还</strong>、<strong>原路退回</strong>。</li></ul>"},{"s":"7.6","st":"跨境支付清算模式（三种）","html":"<h3>（1/3）代理行模式</h3><ul><li>境外参与行 A 在具有国际结算能力的境内代理行 B 开立人民币账户，通过该账户实现人民币跨境清算。</li><li>链路：外币支付 → 境外客户 → 境外参与行 A →（SWIFT 链接 / CIPS 专线）→ 境内代理行 B →（CNAPS 链接）→ 境内客户 C。</li><li>案例（出口）：花旗 → 建行（代理行）→ 中行（CNAPS）→ 境内客户。</li></ul><h3>（2/3）清算行模式</h3><ul><li>境外参加行 A 在境外人民币清算银行 B（含境外分行与境内分行）开立账户，通过清算行进行人民币跨境清算。</li><li>链路：外币支付 → 境外参与行 A → 境外清算行 B（境外分行）→（SWIFT/CIPS）→ 境内清算行 B（境内分行）→（CNAPS）→ 境内客户 C。</li><li>案例（出口）：花旗 → 建行（境外/境内分行）→ 中行。</li></ul><h3>（3/3）NRA 模式</h3><ul><li>境外客户在境内银行 A 开立结算账户（跨境开立人民币或外币 NRA 账户），通过境内银行清算系统和人民银行跨行支付系统完成人民币跨境结算与清算。</li><li>链路：境外客户 →（CNAPS 链接）→ 境内结算行 A → 境内收款行 B → 境内客户 C。</li><li>案例（出口）：建行 → 中行。</li></ul>"},{"s":"7.7","st":"跨境提现结汇","html":"<ul><li>主流币种支持 <strong>T+0 结算</strong>。</li><li>提现方式：普通提现、极速提现、加急提现、挂单提现。</li><li>可选提现币种：USD、CAD、EUR、GBP、HKD、IDR、MYR、MXN 等。</li><li><strong>结汇提款案例流程（1/4–4/4）</strong>：</li></ul><ol><li>申请提款（查看多币种账户余额，如 NZD、AUD）。</li><li>选择收款人（提款至银行账户 / 支付宝账户；支持付款人名称定制）。</li><li>选择结汇订单（为满足跨境交易真实性管理要求，提人民币时需选择可结汇订单；展示专享汇率，如 1 USD≈7.13 CNY）。</li><li>确认交易信息 → 结汇提款成功（如 $10,000.00 → ￥65,009.00）。</li></ol>"},{"c":8,"ct":"跨境支付风控策略","chapIntro":true,"html":"<blockquote>本章讲\"风险怎么防\"：先建立对跨境风控的整体认识（三分交易、七分风控），梳理风险类型与反洗钱难点，再给出事前 / 事中 / 事后全流程风控策略，以及一套可落地的风控规则与风控体系。</blockquote>"},{"s":"8.1","st":"什么是跨境风控","html":"<ul><li><strong>定义</strong>：在跨境电商交易中，通过一系列措施和手段，对交易过程中可能出现的各种风险进行预防和控制，保障交易安全顺利进行。</li><li><strong>核心理念</strong>：<strong>三分交易、七分风控</strong>。需识别并减少洗钱、刷单、盗刷、拒付、套汇、骗汇等不良行为；基于<strong>设备 + 账号 + IP + 交易情况</strong>多维判断支付风险。</li></ul>"},{"s":"8.2","st":"跨境支付面临的风险","html":"<ul><li><strong>背景风险</strong>：批量养号、薅羊毛、恶意占库存、三方欺诈订单、黄牛刷单、钓鱼木马、电信诈骗、虚假交易申报、盗卡盗刷/刷单套现/洗钱、营销作弊、积分套利、虚假/垃圾注册、撞库、暴力破解等。</li><li><strong>风控痛点</strong>（贯穿下载、商品推荐、浏览、订单支付、交易等各环节）：虚假资质、违规经营、违规/侵权/禁销商品、支付欺诈、洗钱套现、恶意退款、黑产、盗号、黑卡、养号、秒杀、风险 IP、虚假营业、伪冒、虚假用户、高危地区等。</li></ul>"},{"s":"8.3","st":"跨境支付风险分析：三大\"割裂性\"","html":"<ul><li><strong>地域割裂性</strong>：是否来自高危地区。</li><li><strong>交易主体割裂性</strong>：是否为真实交易。</li><li><strong>资金情况割裂性</strong>：是否骗汇、洗钱。</li></ul>"},{"s":"8.4","st":"跨境支付风险类型","html":"<div class=\"tbl-wrap\"><table><thead><tr><th>风险类型</th><th>表现</th><th>背后违法行为</th></tr></thead><tbody><tr><td>虚假交易</td><td>用虚假物流凭证/交易信息办理外汇支付、违规超范围购付汇、提供虚假国际收支申报数据</td><td>套汇、骗汇</td></tr><tr><td>虚假交易身份</td><td>通过境外关联公司与境内自有主体\"左手倒右手\"交易</td><td>违反外汇规定</td></tr><tr><td>资金转移</td><td>将大额资金拆分为多笔小额、多次向多人汇入</td><td>洗钱</td></tr><tr><td>资金挪用</td><td>支付收款机构将客户资金挪用至境外公司账户</td><td>违反支付机构相关规定</td></tr><tr><td>用户欺诈</td><td>消费信贷失信、国际信用卡拒付、物流拒收等恶意消费</td><td>诈骗</td></tr></tbody></table></div>"},{"s":"8.5","st":"跨境支付反洗钱难点","html":"<ul><li><strong>客户信息获取</strong>：跨国客户身份不一致，经营情况/财务信息难获取，尽调审核真实性困难。</li><li><strong>交易真实性</strong>：难以完全做到\"三流合一\"审核，无法验证交易真实性。</li><li><strong>可疑交易监测</strong>：跨境贸易中存在大量以洗钱为目的的虚假交易，支付机构获取交易信息有限。</li><li><strong>监管政策差异</strong>：各国跨境贸易监管与反洗钱制度不同，既要符合国内要求，也要符合所在国监管。</li></ul>"},{"s":"8.6","st":"跨境支付风控策略（事前 / 事中 / 事后）","html":"<h3>事前 / 交易中策略</h3><ul><li><strong>交易欺诈预判</strong>：对订单欺诈性提前预判、快速识别，对订单进行风控拦截。</li><li><strong>网站合规检查</strong>：扫描商家网站产品类型，控制风险行为、杜绝非法交易。</li><li><strong>风险订单实时通知</strong>：识别风险订单后，通过邮件/手机/站内通知全方位提醒。</li><li><strong>3DS 动态验证</strong>：有效降低信用卡盗刷带来的潜在风险。</li><li><strong>非法数据透传监控</strong>：对网站订单透传监控与实时分析，发现非法透传自动关闭交易功能。</li></ul><h3>事前风控审核</h3><ul><li><strong>身份认证 / KYC 认证</strong>：核实入网主体提交的身份信息、证照资料真实性；了解客户（KYB/KYC），判断是否具备入网条件、有无不良记录或行业黑名单。</li></ul><h3>案例：订单支付 3DS 验证</h3><ul><li><strong>3DS（3-Domain Secure）</strong>：卡组织为减少在线支付盗刷推出的安全验证服务。</li><li>流程：发卡行验证页（3DS1 验证码 / 3DS2 有效期、地址）→ 验证成功（是持卡人本人）→ 发卡行授权；验证失败（非本人）→ 订单交易失败。</li></ul><h3>事中风控监控（规则示例）</h3><div class=\"tbl-wrap\"><table><thead><tr><th>序号</th><th>规则</th><th>处置措施</th></tr></thead><tbody><tr><td>1</td><td>单笔交易限额 ≥ X 元</td><td>拦截</td></tr><tr><td>2</td><td>来自高风险国家/地区的交易</td><td>增加 3DS 验证</td></tr><tr><td>3</td><td>持卡人命中黑名单</td><td>拦截</td></tr><tr><td>4</td><td>退款金额 X2 ＞ 当日正向交易额 X1</td><td>拦截</td></tr><tr><td>5</td><td>晚 12 点 ~ 凌晨 4 点交易</td><td>交易结算资金冻结</td></tr><tr><td>6</td><td>177 / 188 等手机号段交易</td><td>拦截</td></tr><tr><td>7</td><td>6228 / 926234 等银行卡 BIN 出金</td><td>交易结算资金冻结</td></tr><tr><td>8</td><td>同设备/同用户当天高频下单 Y 次</td><td>拦截</td></tr><tr><td>9</td><td>账户 N 月未交易、当月消费笔数 ≥ X</td><td>资金冻结 + 人工介入核查</td></tr></tbody></table></div><h3>案例：订单支付风控处置</h3><ul><li>订单 1（反作弊）→ 风控拒绝 → 交易失败。</li><li>订单 2（风控通过）→ 发起支付请求 → 进入授权环节。</li><li>订单 3（增强验证）→ 进入 3DS 验证。</li></ul><h3>事后风控复盘</h3><ul><li><strong>调单检查</strong>：交易完成后调取商户订单，按定向维度抽查。</li><li><strong>拒付处理</strong>：持卡人拒认账单，通过发卡行向卡组织投诉要回资金。</li><li><strong>指标预警</strong>：卡组织/合作银行对拒付率、风险交易比例有严格要求，超限将受处罚（提高费率、罚款、停止交易）。</li><li><strong>案例拒付处理</strong>：拒付理由含货物未收到、欺诈、与描述不符、订阅已取消、重复订单等。</li></ul>"},{"s":"8.7","st":"跨境支付风控体系（总览）","html":"<ul><li><strong>业务风险场景</strong>：注册登录、修改密码、签到、卡券领取、订单支付、钱包充值/提现、账户转账、异地支付。</li><li><strong>三道防线</strong>：</li><li>事前：KYC / KYB、身份认证、客户准入、合规审查。</li><li>事中：实时监控、预警机制、拦截机制、验证机制、熔断机制、巡查机制、资金冻结、大额可疑交易、高频交易。</li><li>事后：调单检查、拒付处理、欺诈情报、指标预警、问题反馈、监管上报、商户清退、司法配合、实地调查。</li><li><strong>风控管理系统</strong>：风控规则、黑名单管理、规则引擎、策略规则引擎、风控模型、风险画像。</li><li><strong>数据底座</strong>：用户数据、商户数据、交易数据、行为数据、银行数据、银联数据、第三方数据。</li><li><strong>算法能力</strong>：行为相似度算法、账号聚集度算法、异常设备登录识别、安全认证、事件采集、分析引擎、风险监控、事件库管理。</li><li><strong>处置决策</strong>：拒绝 / 增强验证 / 放行。</li></ul>"},{"c":9,"ct":"跨境支付监管合规","chapIntro":true,"html":"<blockquote>本章是课程的收尾与\"红线\"：界定跨境合规与合规风险，列出展业四合规（监管/业务/数据/资金）与关键政策法规，对比跨境外汇与跨境人民币两套许可体系，梳理境内外牌照要求，并提示二清、违规类型与监管趋势。</blockquote>"},{"s":"9.1","st":"什么是跨境合规","html":"<ul><li><strong>定义</strong>：在跨境支付业务中建立的统一标准，涉及技术标准、业务规范、行业政策和法律法规等。</li><li><strong>合规风险</strong>：盗卡盗刷、资金二清、恶意退货、洗钱、跑分、刷单、电诈、羊毛等。</li></ul>"},{"s":"9.2","st":"展业四合规（监管 / 业务 / 数据 / 资金）","html":"<p>境内支付机构展业三原则：<strong>了解你的客户（KYC）、了解你的业务、尽职调查</strong>。</p><div class=\"tbl-wrap\"><table><thead><tr><th>维度</th><th>要点</th></tr></thead><tbody><tr><td>监管合规</td><td>遵循国际反洗钱公约及监管法规；在多地拥有支付牌照/资质；取得\"信息系统安全等级保护三级\"；通过 PCI DSS（支付卡行业数据安全标准）认证</td></tr><tr><td>业务合规</td><td>建立客户身份资料与交易记录保存制度；建立客户身份识别制度；履行反洗钱义务</td></tr><tr><td>数据合规</td><td>遵循《数据安全法》《个人信息保护法》等；建立大额交易和可疑交易报告制度</td></tr><tr><td>资金合规</td><td>用户资金存放于支付机构在境外央行开立的备付金账户，无挪用风险；资金操作严格按客户授权指令进行</td></tr></tbody></table></div>"},{"s":"9.3","st":"跨境支付相关政策法规（时间线）","html":"<div class=\"tbl-wrap\"><table><thead><tr><th>发布时间</th><th>法规名称</th><th>文号</th></tr></thead><tbody><tr><td>2018-01-04</td><td>关于进一步完善人民币跨境业务政策促进贸易投资便利化的通知</td><td>银发〔2018〕3 号</td></tr><tr><td>2019-04-29</td><td>支付机构外汇业务管理办法</td><td>汇发〔2019〕13 号</td></tr><tr><td>2019-10-23</td><td>国家外汇管理局关于进一步促进跨境贸易投资便利化的通知</td><td>汇发〔2019〕28 号</td></tr><tr><td>2020-04-10</td><td>国家外汇管理局关于优化外汇管理支持涉外业务发展的通知</td><td>汇发〔2020〕8 号</td></tr><tr><td>2020-12-31</td><td>关于进一步优化跨境人民币政策支持稳外贸稳外资的通知</td><td>银发〔2020〕330 号</td></tr><tr><td>2021-01-19</td><td>银行跨境业务反洗钱和反恐怖融资工作指引（试行）</td><td>银发〔2021〕16 号</td></tr><tr><td>2022-06-16</td><td>关于支持外贸新业态跨境人民币结算的通知</td><td>银发〔2022〕139 号</td></tr></tbody></table></div>"},{"s":"9.4","st":"跨境外汇支付 vs 跨境人民币支付（许可对比）","html":"<div class=\"tbl-wrap\"><table><thead><tr><th>维度</th><th>跨境外汇支付</th><th>跨境人民币支付</th></tr></thead><tbody><tr><td>主要法规</td><td>《支付机构外汇业务管理办法》（汇发〔2019〕13 号）</td><td>《关于支持外贸新业态跨境人民币结算的通知》（银发〔2022〕139 号）</td></tr><tr><td>监管部门</td><td>外汇管理局（总局 / 地方外管局）</td><td>人民银行（宏观审慎管理局 / 银行所在地人行）</td></tr><tr><td>支付币种</td><td>外币</td><td>出入境均为人民币</td></tr><tr><td>结算币种</td><td>外币</td><td>人民币</td></tr><tr><td>所需资质</td><td>互联网支付牌照 + 贸易外汇收支企业名录登记</td><td>互联网支付牌照 + 跨境人民币业务备案</td></tr><tr><td>展业范围</td><td>货物贸易、酒店住宿、留学教育、机票、国际展览/旅游/软件/运输/会议/通信等</td><td>不在负面清单内的场景均可</td></tr><tr><td>管理方式</td><td>批准制</td><td>备案制</td></tr><tr><td>备付金</td><td>专用账户仅办跨境外汇业务</td><td>专用存款账户仅办跨境人民币业务</td></tr><tr><td>能否在岸换外汇</td><td>—</td><td>不能</td></tr></tbody></table></div>"},{"s":"9.5","st":"支付机构开展跨境业务的条件","html":"<ul><li>具有《支付业务许可证》。</li><li>拥有外汇管理局准许开展跨境外汇支付业务试点的批复文件。</li><li>有地方央行分支机构颁发的人民币跨境支付牌照批复文件。</li></ul><h3>持牌展业（合规先行、双边持牌）</h3><ul><li>需先取得中国境内互联网支付牌照，再向外汇管理局和地方人行申请，批准后持牌支付机构可与银行合作开展跨境支付业务。</li><li>核心证照：《支付业务许可证》《跨境外汇支付业务许可证》《跨境人民币结算业务许可证》；中国支付清算协会会员证。</li><li>常见认证：CCRC、信息安全/信息安全管理体系认证、PCI DSS 支付行业数据安全标准认证等。</li></ul>"},{"s":"9.6","st":"海外支付牌照汇总（不完全统计）","html":"<div class=\"tbl-wrap\"><table><thead><tr><th>国家/地区</th><th>牌照要求</th></tr></thead><tbody><tr><td>美国</td><td>联邦报备接受 FinCEN 监管，各州展业需州政府批准</td></tr><tr><td>英国</td><td>FCA 授权，可选 SPI 或 EMI</td></tr><tr><td>香港</td><td>MSO 牌照（汇款服务 / 货币兑换），申请难度较低</td></tr><tr><td>新加坡</td><td>储值支付牌照 SVF；外汇业务需 MAS 的 Money Changing 牌照</td></tr><tr><td>日本</td><td>FTB0（资金移动业）牌照</td></tr><tr><td>欧洲</td><td>EMI（电子货币机构）和 PI（支付机构）牌照，含金量高</td></tr><tr><td>澳大利亚</td><td>ASIC 颁发的 AFSL</td></tr><tr><td>泰国</td><td>当地央行（BOT）签发的支付服务许可</td></tr><tr><td>印尼</td><td>本地支付服务商需 FUND TRANSFER LICENSE</td></tr></tbody></table></div><h3>案例：香港 MSO（申请难度低）</h3><ul><li>监管：香港海关；申请主体：股东/高管具本地身份、法人为常住居民。</li><li>合规：定期审计、设独立部门与雇员、完成反洗钱/反恐融资风险评估。</li><li>注册：最低 50 万港币、本地商业办公地址；技术：在线金融服务需全面金融科技测试并设置补救措施；有效期 2 年。</li></ul><h3>案例：欧盟 EMI（含金量高）</h3><ul><li>牌照分 PI（Payment Institution）与 EMI（E-Money Institution），可在欧盟 27 国合规展业。</li><li>四要件：注册（本地设公司、运营及资本保证金，原始资本 ≥ 35 万欧元）、运营（商业计划与可行性）、高管（从业资格、健康财务、无金融犯罪记录）、风控（风险管理框架 + 反洗钱策略、资金进出与核心系统安全、随机审计）。</li></ul>"},{"s":"9.7","st":"跨境外汇业务名录登记","html":"<ul><li>截至 2023 年 9 月，已有 <strong>23 家支付机构和 16 家银行</strong>可凭交易电子信息为贸易企业提供跨境电商外汇服务。</li><li>代表机构：汇付天下、首信易支付、PingPong、财付通、银联、连连支付（LianLianPay）、通联支付（ALLINPAY）、易宝支付（YeePay）等。</li></ul>"},{"s":"9.8","st":"统一监管报送","html":"<ul><li>商业银行统一报送工作台涵盖：1104 报表、新资本报表、EAST 数据质量校验、客户风险统计、外管局报送、司法查询、反洗钱、跨部门综合监管（PISA）、利率报备、理财及信托统计等。</li><li>监管报送功能：模板/指标管理、数据统计、在线填报、数据校验/审核、报文生成、监管指标分析，以及统一监管数据集市与数据源整合（核心交易、账务、会计、清算等系统）。</li></ul>"},{"s":"9.9","st":"跨境外汇违规类型与情形","html":"<h3>违规类型</h3><ul><li><strong>利用差价</strong>：以官方汇率兑换后，在非法市场高价销售套取收益。</li><li><strong>假冒交易</strong>：用虚假物流信息办外汇支付、系统自动分拆购付汇、国际收支数据违规申报。</li><li><strong>资本非法流动</strong>：非法转移资金跨国界，涉洗钱、逃税、贪污。</li><li><strong>逃避外汇管制</strong>：化整为零小额多人次转移汇入，借第三方支付非法转移资金。</li><li><strong>消费欺诈</strong>：信用卡拒付、邮件拒收套取退款等恶意消费。</li></ul><h3>常见违规情形（11 类）</h3><p>违反外汇登记/账户管理/结汇/售汇管理规定；违规办理经常项目资金收付；办理服务贸易收汇未尽职审查；未审查交易单证真实性及与外汇收支一致性；未核验服务贸易对外支付税务备案表；未提交有效单证或单证不真实；未报送财务会计报告/统计报表；未国际收支统计申报等。</p><h3>监管处罚实例</h3><ul><li>富*支付：违反规定将境内外汇转移境外，罚款 140.12 万、没收违法所得 1.27 万。</li><li>联*优势：违反规定将境内外汇转移境外，被北京外汇管理部罚 1095 万。</li><li>宝*付：被罚款 213 万元。</li><li>东*电子：未按规定报送大额客户交易，罚款 12.5 万元。</li></ul>"},{"s":"9.10","st":"支付\"二清\"问题","html":"<ul><li>注：一般国内才有\"二清\"概念；国外通常是直接结算给平台，平台可自行结算给关联方。</li><li>链路：境外消费者资金账户 → 电商平台资金账户 →（付汇/清算）→ 第三方支付机构备付金账户 →（结汇）→ 境内商家资金账户。平台转代付模式存在二清合规风险。</li></ul>"},{"s":"9.11","st":"跨境支付合规思考","html":"<ul><li>在人民银行完成\"境内断直连\"\"备付金集中存管\"等改革后，\"<strong>跨境支付断直连</strong>\"是否会成为跨境支付业务的下一个趋势？值得行业持续关注。</li></ul>"}];

var cur = 0;
var N = PAGES.length;
var viewer = document.getElementById('viewer');
var bodyHtml = document.getElementById('bodyHtml');
var chapLabel = document.getElementById('chapLabel');
var secLabel = document.getElementById('secLabel');
var posLabel = document.getElementById('posLabel');
var progBar = document.getElementById('progBar');
var prevBtn = document.getElementById('prevBtn');
var nextBtn = document.getElementById('nextBtn');

function render() {
  var p = PAGES[cur];
  if (p.intro) { chapLabel.textContent = '前言'; secLabel.textContent = p.title; }
  else if (p.chapIntro) { chapLabel.textContent = '第' + p.c + '章 · ' + p.ct; secLabel.textContent = '本章导言'; }
  else { chapLabel.textContent = '第' + p.c + '章 · ' + p.ct; secLabel.textContent = p.s + ' ' + p.st; }
  bodyHtml.innerHTML = p.html;
  posLabel.textContent = (cur + 1) + ' / ' + N;
  progBar.style.width = ((cur + 1) / N * 100) + '%';
  viewer.scrollTop = 0;
  prevBtn.disabled = (cur === 0);
  nextBtn.disabled = (cur === N - 1);
}
function go(d) { cur = Math.max(0, Math.min(N - 1, cur + d)); render(); }
prevBtn.onclick = function () { go(-1); };
nextBtn.onclick = function () { go(1); };

var sy = 0, sT = 0;
viewer.addEventListener('touchstart', function (e) { sy = e.touches[0].clientY; sT = Date.now(); }, { passive: true });
viewer.addEventListener('touchend', function (e) {
  var dy = e.changedTouches[0].clientY - sy;
  var dt = Date.now() - sT;
  if (Math.abs(dy) > 50 && dt < 800) { go(dy < 0 ? 1 : -1); }
}, { passive: true });
document.addEventListener('keydown', function (e) {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); go(1); }
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); go(-1); }
});

var tocEl = document.getElementById('tocList');
var tocMask = document.getElementById('tocMask');
var toc = document.getElementById('toc');
function buildToc() {
  var html = '';
  for (var i = 0; i < TOC.length; i++) {
    var ch = TOC[i];
    html += '<div class="toc-chap" data-i="' + i + '"><span>第' + ch.num + '章 ' + ch.title + '</span><span class="caret">›</span></div>';
    html += '<div class="toc-secs" data-secs="' + i + '">';
    for (var j = 0; j < ch.sections.length; j++) {
      var sec = ch.sections[j];
      html += '<div class="toc-sec" data-idx="' + sec.idx + '">' + (sec.s ? sec.s + ' ' : '') + sec.st + '</div>';
    }
    html += '</div>';
  }
  tocEl.innerHTML = html;
  var chaps = tocEl.querySelectorAll('.toc-chap');
  chaps.forEach(function (c) {
    c.onclick = function () {
      c.classList.toggle('open');
      var si = c.getAttribute('data-i');
      var secs = tocEl.querySelector('.toc-secs[data-secs="' + si + '"]');
      secs.classList.toggle('open');
    };
  });
  var secsBtns = tocEl.querySelectorAll('.toc-sec');
  secsBtns.forEach(function (s) {
    s.onclick = function () { cur = parseInt(s.getAttribute('data-idx'), 10); render(); closeToc(); };
  });
}
function openToc() { toc.classList.add('show'); tocMask.classList.add('show'); }
function closeToc() { toc.classList.remove('show'); tocMask.classList.remove('show'); }
document.getElementById('tocBtn').onclick = openToc;
tocMask.onclick = closeToc;
buildToc();
render();

</script>
